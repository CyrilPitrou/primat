# Read the Docs build configuration for the primat documentation site.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The site is Sphinx (see docs/conf.py). We install primat itself with the
# ``docs`` extra so autodoc can import the package; the optional heavy deps
# (numba/vegas/plotly/streamlit) are mocked in conf.py, so a plain pip install
# is enough and the C backend's compiled extension is allowed to fail
# gracefully (setup.py's optional_build_ext) without breaking the docs build.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # RTD's managed Sphinx invocation (the ``sphinx:`` config block below)
    # runs with ``-j auto``, parallelising the doc-reading phase across every
    # CPU on the build machine. sphinx-argparse 0.6.0 (latest as of writing,
    # used by docs/cli.md to autogenerate the CLI reference) doesn't
    # implement ArgParseDomain.merge_domaindata, which parallel reads require
    # -- so any nproc > 1 crashes with "NotImplementedError: merge_domaindata
    # must be implemented ... to be able to do parallel builds". This never
    # showed up locally (a plain ``sphinx-build`` with no ``-j`` flag is
    # serial), only on RTD's runner. Override the html build command to force
    # ``-j 1`` explicitly rather than relying on RTD's default.
    build:
      html:
        - python -m sphinx -j 1 -T -W --keep-going -b html -d docs/_build/doctrees docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
