name: Build wheels and sdist

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: "Publish the built artifacts to TestPyPI (PyPiGuide.md dry-run step)"
        type: boolean
        default: false

jobs:
  build_wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-latest/ubuntu-24.04-arm each build natively for their own
        # arch (no QEMU emulation, which previously hung pulling the aarch64
        # manylinux image cross-arch). macos-14 alone covers both macOS
        # arches via Xcode cross-compilation -- macos-13 dropped as redundant.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.23
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux* pp*"          # skip PyPy + musl initially; add later if needed
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          # auto64 (NOT auto): cibuildwheel's Linux "auto" builds both the
          # 64-bit native arch *and* i686 (32-bit), but scipy publishes no
          # i686 wheels on PyPI, so the CIBW_TEST_COMMAND smoke test's
          # `pip install` of an i686 primat wheel falls back to building
          # scipy from source, which fails (no OpenBLAS on the runner).
          # auto64 = the 64-bit native arch only (x86_64 here, aarch64 on the
          # ubuntu-24.04-arm runner), which is all we ship.
          CIBW_ARCHS_LINUX: "auto64"
          # AMD64 only: cibuildwheel's Windows default also builds win32
          # (32-bit), but scipy publishes no win32 wheels on PyPI, so the
          # CIBW_TEST_COMMAND smoke test's `pip install` of a win32 primat
          # wheel falls back to building scipy from source, which fails on
          # the runner's meson/Cython toolchain ("Cython requires python3
          # dependency for link testing").
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          CIBW_ENVIRONMENT: "CFLAGS='-O2'"
          # setup.py's optional_build_ext deliberately lets the C extension
          # fail without failing a *source* build -- but a wheel that
          # silently shipped the 25x-slower pure-Python fallback would be a
          # regression nobody notices. Assert the compiled extension is
          # present and reproduces the documented small-network YPBBN
          # (coarse tolerance: this is a smoke test, not the tight pytest
          # regression).
          CIBW_TEST_COMMAND: >-
            python -c "import primat.backend as b; assert b.HAS_C_BACKEND, 'wheel shipped without C extension'; r=b.run_bbn({'network':'small'}); assert abs(r['YPBBN']-0.247) < 2e-3, r['YPBBN']"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Two separate publish jobs so the testpypi/pypi switch is a matter of
  # *how the workflow is triggered*, not a commit that flips a
  # repository-url/environment line -- the old single `publish` job
  # hard-pointed at TestPyPI with the real index commented out, which was
  # easy to forget to flip and required editing the workflow at the most
  # delicate moment (see PyPiGuide.md).

  publish-testpypi:
    # Only runs on an explicit manual dry run (PyPiGuide.md's TestPyPI dry
    # run step) with the opt-in input checked -- never on a real GitHub
    # release.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write       # PyPI Trusted Publishing (OIDC) -- no token to manage/leak
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    # Only runs when a GitHub release is actually published (PyPiGuide.md
    # Step 6) -- unreachable from workflow_dispatch, so a dry run can never
    # accidentally hit the real index.
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # PyPI Trusted Publishing (OIDC) -- no token to manage/leak
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1

