name: Build Linux Wheel

# LOAD-BEARING for the public demo at primat.streamlit.app -- do NOT remove
# or fold into wheels.yml. Streamlit Community Cloud installs from the
# repo-root requirements.txt, whose last line points at
# ./wheels/primat-<version>-cp312-*-linux_x86_64.whl; this workflow is how
# that committed wheel is produced (manually, via workflow_dispatch, then
# committed by hand under wheels/ -- see wheels/README.md and CLAUDE.md's
# "Streamlit Cloud deployment chain" section). Pinned to Python 3.12
# specifically because that is the wheel tag Streamlit Cloud's runtime needs.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build backend
        run: pip install build

      - name: Build the C extension wheel
        run: python -m build --wheel

      - name: Upload the wheel file
        uses: actions/upload-artifact@v4
        with:
          name: linux-wheel
          path: dist/*.whl
