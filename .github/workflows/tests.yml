name: Tests

# Runs the pytest suite (see tests/README.md for the marker tiers). Two
# lanes:
#   - "test" (push/PR): the fast + default-precision-solve lane
#     (`-m "not slow or solve"`), matrixed across OS x Python version so a
#     platform- or version-specific regression is caught before merge.
#   - "nightly": the full suite (including the tight `reference` regression
#     and the `wheel` install smoke test) on a schedule, since those tiers
#     are too slow (~4 min total) to run on every push.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # 03:17 UTC daily -- an off-the-hour time to avoid GitHub Actions'
    # documented "everyone runs on the hour" scheduling congestion.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  test:
    if: github.event_name != 'schedule'
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Only the two extremal Python versions on macOS/Windows, to keep
          # matrix minutes sane -- ubuntu already covers the full 3.10-3.13
          # span above.
          - os: macos-14
            python-version: "3.10"
          - os: macos-14
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install primat + test dependencies
        shell: bash
        run: python -m pip install -v -e ".[recommended,gui,notebooks]" pytest 2>&1 | tee pip-install.log | tail -5
      - name: Assert the compiled C extension is present
        # setup.py's optional_build_ext turns any compile error into a printed
        # warning so `pip install` still succeeds -- which means a platform
        # where the extension stops building runs the whole suite on the 11-18x
        # slower Python fallback, with every C-side test skipped, and says
        # nothing. That is what happened on Windows. Assert it explicitly, and
        # surface the swallowed compiler diagnostic when it fails.
        shell: bash
        run: |
          python -c "import primat.backend as b; print('HAS_C_BACKEND =', b.HAS_C_BACKEND); assert b.HAS_C_BACKEND" || {
            echo "::error::the C extension did not build on ${{ matrix.os }}"
            grep -iE "error|warning: could not build|_wrapper\.c|primat-c" pip-install.log | tail -60
            exit 1
          }
      - name: Run fast + solve lane
        run: pytest tests/ -m "not slow or solve" --junitxml=junit-${{ matrix.os }}-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: junit-${{ matrix.os }}-${{ matrix.python-version }}
          path: junit-${{ matrix.os }}-${{ matrix.python-version }}.xml

  typecheck:
    # Lenient mypy pass (see pyproject.toml's [tool.mypy]) scoped to the
    # handful of public-API modules that carry real type annotations --
    # not a project-wide strictness gate.
    if: github.event_name != 'schedule'
    name: mypy (annotated modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install primat + mypy
        # Pin numpy<2.5 for the type-check job only: numpy>=2.5's __init__.pyi
        # uses PEP-695 `type` statements that mypy cannot parse under
        # python_version="3.10" (see pyproject.toml [tool.mypy]). numpy 2.4.x
        # stubs parse cleanly and keep primat's own modules checked at 3.10.
        run: python -m pip install -e "." mypy "numpy<2.5"
      - name: Type-check annotated modules
        run: mypy primat/backend.py primat/evolution.py primat/config.py primat/main.py primat/plotting.py

  docs:
    # Build the Sphinx documentation site (docs/) with warnings-as-errors, so a
    # broken cross-reference, a missing toctree entry, or an autodoc import
    # failure fails the PR -- the same invocation Read the Docs uses
    # (fail_on_warning). Runs on every push/PR; notebook execution stays off
    # (NB_EXECUTION_MODE default "off") so this lane is fast.
    if: github.event_name != 'schedule'
    name: docs (sphinx-build -W)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install primat + docs dependencies
        run: python -m pip install -e ".[docs]"
      - name: Build HTML docs (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Check every link resolves
        # A bare filename in Markdown is auto-linkified by MyST, and `.md` is a
        # real top-level domain: CHANGELOG.md's unquoted "README.md" became a
        # live link out to a commercial site on the published changelog page,
        # and the HTML build above cannot see it. linkcheck takes ~10 s.
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: docs-html
          path: docs/_build/html

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: nightly full suite (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install primat + test dependencies
        run: python -m pip install -e ".[recommended,gui,notebooks]" pytest build
      - name: Run full suite (including reference and wheel markers)
        run: pytest tests/ --junitxml=junit-nightly.xml
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: junit-nightly
          path: junit-nightly.xml
