[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "primat"
version = "0.3.2"
description = "PRIMAT: precise Big Bang Nucleosynthesis computations, with a fast C backend and a pure-Python fallback"
readme = "README.md"
# SPDX license expression (PEP 639) -- the LICENCE file states GPLv3 "or (at
# your option) any later version".
license = "GPL-3.0-or-later"
license-files = ["LICENCE"]
authors = [
    { name = "Cyril Pitrou", email = "pitrou@iap.fr" },
]
maintainers = [
    { name = "Julien Froustey" },
]
keywords = [
    "BBN",
    "big bang nucleosynthesis",
    "cosmology",
    "primordial abundances",
    "early universe",
    "helium",
    "deuterium",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
# Lean core: only what a single ``run_bbn`` / ``PRIMAT(...).solve()`` actually
# needs at import and solve time.  ``joblib`` (parallel Monte-Carlo) and
# ``plotly`` (GUI figures) used to be hard dependencies but are neither on the
# ``import primat`` nor the ``run_bbn`` path, so they now live in extras
# (``mc`` / ``plots`` / ``gui``) -- see [project.optional-dependencies].  A
# core install can still run MC serially (``n_jobs=1``) or via the C backend
# without joblib, and everything except the GUI works without plotly.
# Tested lower bounds, not guessed ones: the "floor" leg of
# .github/workflows/tests.yml pins exactly these and runs the same lane as the
# default leg. They are floors, not the version any given install gets --
# newer Pythons have no wheels this old, so pip resolves upward on its own.
# Raise a bound only together with that CI leg.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/CyrilPitrou/primat"
Documentation = "https://primat.readthedocs.io"
Repository = "https://github.com/CyrilPitrou/primat"
Issues = "https://github.com/CyrilPitrou/primat/issues"
Changelog = "https://github.com/CyrilPitrou/primat/blob/master/CHANGELOG.md"

[project.scripts]
primat = "primat.cli:main"
primat-gui = "primat.gui.launcher:main"

[project.optional-dependencies]
# Recommended experience: JIT (numba), the vegas thermal-rate integrator, and
# joblib for parallel Monte-Carlo (``mc_uncertainty(..., n_jobs != 1)``).
recommended = [
    "numba",
    "vegas",
    "joblib",
]
# Parallel Monte-Carlo only.  ``mc_uncertainty``/``run_mc`` import joblib
# lazily and only when ``n_jobs != 1``; a core install can still run MC
# serially (``n_jobs=1``) or on the C backend with no joblib present.
mc = [
    "joblib",
]
# Interactive plotting.  plotly is used only by the GUI's figure panels
# (``primat/gui/panels.py``); ``primat/plotting.py`` itself is plotly-free.
plots = [
    "plotly",
]
notebooks = [
    "matplotlib",
    "pandas",
    "papermill",
    # papermill executes notebooks through a jupyter kernel; without ipykernel
    # there is no `python3` kernelspec on a fresh install and execution fails
    # with jupyter_client.kernelspec.NoSuchKernel.
    "ipykernel",
]
# Documentation site (Sphinx). Builds the HTML docs under ``docs/`` -- see
# ``docs/conf.py`` for the stack rationale. ``sphinx-build -W`` is run in CI
# and on Read the Docs, so keep these pins in step with what conf.py loads.
docs = [
    # Upper-pin on Sphinx: myst-parser/myst-nb lag new major Sphinx releases by
    # a few months (Sphinx 9 broke a transform myst-parser removes at setup).
    # Additionally, Sphinx >=8.2 enables parallel doc reading more eagerly, and
    # sphinx-argparse 0.6.0 (latest as of writing) doesn't implement
    # ArgParseDomain.merge_domaindata, so a parallel read crashes with
    # "NotImplementedError: merge_domaindata must be implemented ... to be able
    # to do parallel builds" -- this bit Read the Docs's build (which resolved
    # 8.2.3) even though a local ``pip install`` had backed off to 8.1.3 on its
    # own. Pin below 8.2 explicitly rather than relying on the resolver to
    # pick a safe version by accident. Revisit once sphinx-argparse ships
    # parallel-read support.
    "sphinx>=7,<8.2",
    "furo",
    "myst-parser>=2",
    "myst-nb>=1",
    # Required by the MyST ``linkify`` extension (bare-URL autolinking) enabled
    # in docs/conf.py's ``myst_enable_extensions``.
    "linkify-it-py",
    "sphinx-copybutton",
    "sphinx-argparse",
    # Live-reload local preview (``make docs-live``): rebuilds and refreshes the
    # browser on every save. Not needed by CI/Read the Docs, only for local dev.
    "sphinx-autobuild",
]
gui = [
    "streamlit",
    "pandas",
    "plotly",
]
# Everything (physics perf + MC + plotting + GUI + notebooks) in one shot.
all = [
    "numba",
    "vegas",
    "joblib",
    "plotly",
    "streamlit",
    "pandas",
    "matplotlib",
    "papermill",
]

[tool.setuptools]
packages = ["primat", "primat.gui", "primat.weak_rates"]

[tool.setuptools.package-data]
"primat" = ["data/**/*", "gui/.streamlit/*", "py.typed"]

# Lenient type checking scoped to the public-API modules that carry real
# annotations. Internal numerics (network_data.py,
# nuclear_network.py, weak_rates/, ...) stay untyped on purpose -- this is
# not a project-wide strictness push, just IDE/Pylance support for the
# surface callers actually import (backend.run_bbn/run_mc, PRIMAT, MCResult,
# PRIMATConfig, evolution.py, plotting.py).
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
# Don't typecheck the bodies of unannotated modules pulled in transitively
# (network_data.py, nuclear_network.py, cache_utils.py, ...) -- only the
# five modules below are meant to be mypy-clean.
follow_imports = "silent"
# NOTE on numpy stubs: numpy >= 2.5 ships PEP-695 `type` statements in
# numpy/__init__.pyi, which mypy refuses to PARSE under python_version =
# "3.10" ("Type statement is only supported in Python 3.12"). A
# per-module `follow_imports = "skip"` override does NOT help -- mypy still
# parses a directly-imported stub package, so the syntax error fires
# regardless. Rather than weaken this whole config to python_version =
# "3.12" (which would stop catching genuinely 3.10-incompatible annotations
# in primat's own five modules), the CI mypy job pins `numpy<2.5` (whose
# stubs parse cleanly under 3.10); see .github/workflows/tests.yml. Revisit
# if/when mypy learns to skip unparseable followed stubs.
