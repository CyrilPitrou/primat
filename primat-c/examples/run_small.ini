# run_small.ini -- the default ("small", 12-reaction) network at the
# standard SM baryon density. See tests/README.md's "Validation
# reference" for the expected YPBBN/D-H values.
#
#   cd primat-c && make && ./build/primat-c --ini examples/run_small.ini
#
# run_basic.ini beside this file lists all 96 settable keys with a
# one-line description each.
network = small
Omegabh2 = 0.02242
DeltaNeff = 0
numerical_precision = 1e-7
