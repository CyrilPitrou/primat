# run_large_amax8.ini -- the "large" network filtered to A<=8, i.e. 68
# reactions over 12 nuclides. Slower than run_small.ini and the setting
# tests/README.md's validation reference tabulates alongside "small".
#
#   cd primat-c && make && ./build/primat-c --ini examples/run_large_amax8.ini
#
# run_basic.ini beside this file lists all 96 settable keys with a
# one-line description each.
network = large
amax = 8
Omegabh2 = 0.02242
DeltaNeff = 0
numerical_precision = 1e-7
